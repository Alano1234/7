<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7 DAYS WITH YOUR ROOMMATE — Prototype 0.1</title><style>
:root{--bg:#f3efe7;--card:#fffdf8;--ink:#24211d;--muted:#746d63;--line:#ddd5c9;--accent:#6e5af0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1080px;margin:auto;padding:22px 14px 40px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}h1{margin:0 0 6px;font-size:27px}.sub{color:var(--muted);font-size:13px}.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:1.25fr .9fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 4px 18px rgba(40,30,15,.05)}.scenehead{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:12px}.hint{font-size:12px;color:var(--muted)}.choices{display:grid;gap:9px}button{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;font:inherit}button:hover{background:#fbf9f4}button:disabled{opacity:.45;cursor:not-allowed}.ct{font-weight:700}.cd{font-size:12px;color:var(--muted);margin-top:3px}.event{display:none;margin-top:13px;padding:13px;background:#f6f2ff;border:1px solid #d9d0ff;border-radius:13px}.event b{display:block;margin-bottom:5px}.event p{margin:0;font-size:13px;line-height:1.55}.actions{display:flex;gap:8px;margin-top:12px}.primary{background:var(--accent);border-color:var(--accent);color:white}.meter{margin:10px 0}.mh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.bar{height:7px;background:#ece7de;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.log{max-height:300px;overflow:auto}.entry{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}.entry:last-child{border:0}.tag{font-size:10px;border:1px solid var(--line);padding:2px 6px;border-radius:99px;color:var(--muted);margin-right:5px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini>div{padding:9px;border:1px solid var(--line);border-radius:11px;background:#faf7f0;font-size:12px;line-height:1.45}@media(max-width:760px){.top,.grid{display:block}.stats{margin-top:12px}.grid .card+ .card{margin-top:15px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>7 DAYS WITH YOUR ROOMMATE</h1><div class="sub">Prototype 0.1 · Day 1 · 行动 → 事件 → 选择 → 后果 → 记忆 · 新版会自动清除旧浏览器状态</div></div><div class="stats"><div class="pill">Day <b id="day">1</b></div><div class="pill">时间 <b id="time">早晨</b></div><div class="pill">💰 $<b id="money">120</b></div><div class="pill">📍 <b id="place">公寓</b></div></div></div><div class="grid"><main class="card"><div class="scenehead"><div><b id="scene">你的新房间</b><div class="hint" id="hint">行李还没拆完。客厅传来游戏手柄的声音。</div></div><div class="hint">每段时间可做 1 次主要行动</div></div><div class="choices" id="choices"></div><div class="event" id="event"><b id="et"></b><p id="ex"></p></div><div class="actions"><button class="primary" id="next" onclick="advance()">进入下一时间段</button><button onclick="hardReset()">重开 Day 1（清除存档并刷新）</button></div></main><aside><div class="card"><b>关系</b><div id="rels"></div></div><div class="card" style="margin-top:15px"><b>最近发生</b><div class="log" id="log"></div></div><div class="card" style="margin-top:15px"><b>手机（简版）</b><div class="mini"><div><b>Wallet</b><br>$<span id="wallet">120</span></div><div><b>Memory</b><br><span id="mc">0</span> 条</div><div><b>Chat</b><br><span id="chat">暂无消息</span></div><div><b>Notes</b><br>房租：周五前</div></div></div></aside></div></div><script>
// Prototype build ID: changing this value intentionally invalidates any older browser-side state.
const BUILD_ID = "prototype-0.1-reset-1";
const BUILD_KEY = "7days-build-id";
const SAVE_PREFIX = "7days-";
try {
  if (localStorage.getItem(BUILD_KEY) !== BUILD_ID) {
    Object.keys(localStorage).filter(k => k.startsWith(SAVE_PREFIX)).forEach(k => localStorage.removeItem(k));
    localStorage.setItem(BUILD_KEY, BUILD_ID);
  }
} catch (e) {}

function hardReset() {
  try {
    Object.keys(localStorage).filter(k => k.startsWith(SAVE_PREFIX)).forEach(k => localStorage.removeItem(k));
    Object.keys(sessionStorage).filter(k => k.startsWith(SAVE_PREFIX)).forEach(k => sessionStorage.removeItem(k));
  } catch (e) {}
  // Cache-busting reload also avoids stale page state/back-forward cache.
  const url = new URL(window.location.href);
  url.searchParams.set("reset", Date.now().toString());
  window.location.replace(url.toString());
}

window.addEventListener("pageshow", (e) => {
  if (e.persisted) window.location.reload();
});

const S={day:1,t:0,times:['早晨','午后','傍晚','晚上'],money:120,place:'公寓',mem:[],used:false,flags:{},rel:{milo:{n:'米洛',v:10,tr:5,te:0},nora:{n:'诺拉',v:5,tr:5,te:0},landlord:{n:'房东',v:-2,tr:3,te:2}}};
const home=[['去客厅看看','认识声音的主人。','milo'],['检查房间','看看有没有什么奇怪的地方。','room'],['整理行李','先把自己的生活弄得像生活。','unpack']];
const city=[['找一份临时工作','今天先赚点现金。','work'],['去便利店','买点吃的，也许会碰到熟人。','store'],['随便走走','看看这座城市。','wander']];
function r(){day.textContent=S.day;time.textContent=S.times[S.t];money.textContent=S.money;wallet.textContent=S.money;place.textContent=S.place;mc.textContent=S.mem.length;rels.innerHTML=Object.values(S.rel).map(x=>`<div class="meter"><div class="mh"><span>${x.n}</span><span>${x.v}</span></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,x.v+50))}%"></div></div><div class="hint">信任 ${x.tr} · 张力 ${x.te}</div></div>`).join('');const a=S.place==='公寓'?home:city;choices.innerHTML=a.map(x=>`<button ${S.used?'disabled':''} onclick="act('${x[2]}')"><div class="ct">${x[0]}</div><div class="cd">${x[1]}</div></button>`).join('');log.innerHTML=S.mem.length?S.mem.slice().reverse().map(x=>`<div class="entry"><span class="tag">${x[0]}</span>${x[1]}</div>`).join(''):'<div class="hint">今天还没有留下什么。</div>'}
function add(type,text){S.mem.push([type,text]);}
function ev(title,text){event.style.display='block';et.textContent=title;ex.textContent=text;}
function act(x){if(S.used)return;S.used=true;
if(x==='milo'){if(!S.flags.milo){S.flags.milo=1;S.rel.milo.v+=8;S.rel.milo.tr+=3;add('Milo','第一次见到米洛：他一边打游戏一边问你会不会玩。');ev('米洛：“你就是新室友？”','他扫了眼你的行李。“行吧，至少长得不像骗子。来一把？”')}else{S.rel.milo.v+=2;S.rel.milo.tr+=1;add('Milo','你和米洛又打了一局游戏。');ev('米洛把手柄递给你','“来，输了别赖我。” 他明显已经把你当成可以随便逗的室友。')}}
if(x==='room'){if(!S.flags.room){S.flags.room=1;add('Anomaly','你发现房间灯偶尔会闪一下。');ev('灯闪了一下','你确定没有碰到开关。熄灭前的一瞬间，墙上的影子似乎多了一层。')}else{S.rel.landlord.te+=1;add('Anomaly','你又检查了一遍灯，但它恢复正常了。');ev('什么都没有','灯好好的。你开始怀疑是不是自己想多了。')}}
if(x==='unpack'){add('Life','你认真整理了房间。');chat.textContent='房东：别忘了周五。';ev('暂时像个家了','你把最重要的东西放在顺手的位置。手机收到一条新提醒：房租周五前。')}
if(x==='work'){S.money+=45;add('Money','你做了一段临时工作，赚了 $45。');ev('工作结束','不算轻松，但钱到账了。你开始觉得这套公寓也许能住得起。')}
if(x==='store'){if(S.money<15){ev('余额不足','你把东西放回去了。')}else{S.money-=15;add('Money','你花 $15 买了饮料和零食。');ev('便利店','结账时，一个动物头居民和你擦肩而过。没人觉得这有什么奇怪。')}}
if(x==='wander'){if(!S.flags.city){S.flags.city=1;add('City','你第一次认真看这座城市：兽人、普通人和各种奇怪居民混在一起生活。');ev('这座城市似乎什么都习惯了','路口的鸟头司机在骂堵车，旁边的普通人类也在一起骂。没有人觉得奇怪。')}else{add('City','你在街区闲逛了一会儿。');ev('街头小插曲','你看到有人把别人的包顺走，然后若无其事地走进人群。有人看见了，但没人立刻追。')}}r()}
function advance(){if(!S.used)add('Life',`你在${S.times[S.t]}什么都没做，发了一会儿呆。`);S.t++;S.used=false;if(S.t>=S.times.length){add('Main Story','Day 1 结束：手机 Memory 出现了一条你不记得写过的记录。');ev('Day 1 晚上','门外传来三下敲门声。没有人说话。你打开手机，Memory 里多了一条记录：“第七天不要离开。”');next.textContent='进入 Day 2（原型暂未开放）';next.disabled=true;S.place='公寓'}else{S.place=S.t===0?'公寓':'附近街区';event.style.display='none'}r()}
r();</script></body></html>

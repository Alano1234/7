<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>7 DAYS WITH YOUR ROOMMATE — Day 1 Free Roam Prototype</title>
<style>
:root{
  --bg:#0e1014;--panel:#171a20;--panel2:#1d2129;--panel3:#12151a;--text:#f4f2ee;--muted:#9fa4ae;
  --line:#2d323c;--accent:#d9b7ff;--accent2:#9fd6ff;--good:#9dd7aa;--warn:#e7c487;--danger:#e89a9a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:radial-gradient(circle at top,#1a1d25 0,#0e1014 55%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 42px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.title{font-size:22px;font-weight:900;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);padding:7px 9px;border-radius:999px;background:#11141a;font-size:12px;color:#d9dce2}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.panel{background:rgba(23,26,32,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden}
.scene{padding:22px;min-height:620px}.tag{display:inline-block;padding:5px 8px;border-radius:7px;background:#282d37;color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.speaker{font-weight:850;color:var(--accent);margin:0 0 9px}.text{white-space:pre-wrap;line-height:1.78;font-size:16px;color:#f0eef2}.small{font-size:13px;color:var(--muted);line-height:1.65}
.choices{display:grid;gap:9px;margin-top:22px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#14171c;color:var(--text);padding:14px 15px;border-radius:12px;cursor:pointer;transition:.15s}.choice:hover{border-color:#6d7280;background:#1c2027}.choice:disabled{opacity:.5;cursor:not-allowed}
.card{border:1px solid var(--line);background:var(--panel3);border-radius:14px;padding:13px;margin-top:13px}.card h3{margin:0 0 8px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.option{border:1px solid var(--line);background:#15181e;color:var(--text);padding:12px;border-radius:12px;text-align:left;cursor:pointer}.option:hover{border-color:#767b88}.option .main{font-weight:800}.option .desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.option.selected{border-color:var(--accent2);background:#1a1f28}
.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);background:#101319;color:var(--text);padding:11px 12px;border-radius:10px;outline:none}.field input:focus,.field select:focus{border-color:#7d8290}
.primary{border:1px solid #7b5f92;background:#2a2033;color:#fff;padding:13px 14px;border-radius:11px;cursor:pointer;font-weight:800}.primary:hover{filter:brightness(1.08)}
.side{display:flex;flex-direction:column;gap:14px}.side .box{background:rgba(20,23,29,.96);border:1px solid var(--line);border-radius:16px;padding:15px}.side h4{margin:0 0 9px;font-size:12px;color:var(--muted);letter-spacing:.3px}.list{display:grid;gap:5px}.item{font-size:12px;line-height:1.45;color:#d6d9df}.item b{color:#fff}.meter{height:8px;background:#0d1015;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:5px}.meter > div{height:100%;background:#8c76a6}.money{font-size:26px;font-weight:900}.inventory{display:grid;gap:7px}.invrow{display:flex;justify-content:space-between;gap:8px;font-size:12px}.muted{color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.toolbar .choice{width:auto;padding:9px 11px}
.location-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}.loc{border:1px solid var(--line);background:#14171c;color:var(--text);padding:14px;border-radius:12px;text-align:left;cursor:pointer;min-height:92px}.loc:hover{border-color:#767b88;background:#1c2027}.loc .name{font-weight:850}.loc .desc{margin-top:5px;font-size:12px;line-height:1.45;color:var(--muted)}
.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.action{border:1px solid var(--line);background:#15181e;color:var(--text);padding:13px;border-radius:12px;text-align:left;cursor:pointer}.action:hover{border-color:#6d7280;background:#1c2027}.action:disabled{opacity:.45;cursor:not-allowed}.action .a-title{font-weight:800}.action .a-cost{margin-top:4px;font-size:11px;color:var(--muted)}
.notice{border-left:3px solid var(--warn);background:#181811;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.6;margin-top:14px}.danger-note{border-left-color:var(--danger);background:#1a1315}.good-note{border-left-color:var(--good);background:#131a15}
.footer{margin-top:12px;color:var(--muted);font-size:11px;line-height:1.6}.success{color:var(--good)}.warning{color:var(--warn)}.danger{color:var(--danger)}
@media(max-width:920px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}.location-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.side{display:block}.grid2,.grid3,.action-grid,.location-grid{grid-template-columns:1fr}.scene{min-height:0;padding:18px}.text{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">7 DAYS WITH YOUR ROOMMATE</div>
      <div class="sub" id="subtitle">DAY 1 · Free Roam Prototype · 玩家自己安排这一天</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="layout">
    <div class="panel"><div class="scene" id="scene"></div></div>
    <div class="side">
      <div class="box"><h4>时间 / 地点</h4><div class="money" id="timePlace">08:00</div><div class="item" id="placeLabel">未进入世界</div></div>
      <div class="box"><h4>钱包</h4><div class="money" id="cash">$180</div></div>
      <div class="box"><h4>当前状态</h4><div id="status"></div></div>
      <div class="box"><h4>背包</h4><div class="inventory" id="inventory"></div></div>
      <div class="box"><h4>关系 / 记忆</h4><div id="relations"></div></div>
      <div class="box"><h4>隐藏数据（原型调试）</h4><div id="hidden"></div></div>
    </div>
  </div>

  <div class="footer">
    本版重点从“剧情播放器”改成“自由行动 + NPC 自己生活 + 动态事件”。诺拉暂不加入；先把米洛与公寓生活跑起来。成人路线只保留系统变量，不包含露骨正文。
  </div>
</div>
<script>
const S={
  day:1, minutes:480, location:'bedroom', mode:'creation',
  player:{name:'',gender:'',body:'',expression:'',orientation:'',age:'成年',clean:'中等',schedule:'普通',noise:'中等',gaming:false,social:'中等',background:'普通租客'},
  cash:180,
  landlordName:'艾德里安·韦尔', landlordTrust:0, landlordFriction:0,
  milo:{
    familiarity:0,trust:0,tension:0,gameBond:0,likedGift:false,
    height:189,skin:'小麦色',bodyType:'高壮运动型',tattoo:true,
    lazy:85,messy:88,noisy:75,snoring:95,gaming:90,sports:78,bar:72,prank:88,swearing:82,
    lookDriven:86,sexualOpenness:74,boundaryRespect:46,
    knownForTrouble:true,hasFriendCircle:true,
    scheduleNote:'会根据时间自己行动；不是站桩 NPC。'
  },
  tuantuan:{met:false,familiarity:0},
  adultOn:true, adultExposure:0,
  energy:100,
  memories:[], contacts:[], items:{sandwich:1,drink:1,gamepad:0,gift:0},
  flags:{worked:false,shop:false,gifted:false,prank:false,waterSeen:false,landlordAsked:false,miloNoise:false,tuantuanMet:false,anomalySeen:false,day1Ended:false,metMilo:false,introDone:false,morningMiloDone:false},
  logs:[],dynamicCooldown:0
};

const money=n=>`$${n}`;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pad=n=>String(n).padStart(2,'0');
function timeString(){const h=Math.floor(S.minutes/60),m=S.minutes%60;return `${pad(h)}:${pad(m)}`}
function esc(x){return String(x).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]||m));}
function addMemory(m){if(!S.memories.includes(m))S.memories.push(m)}
function log(m){S.logs.unshift(`${timeString()} · ${m}`);S.logs=S.logs.slice(0,18)}
function addCash(n,reason){S.cash=Math.max(0,S.cash+n);if(reason)log(`${n>=0?'+':''}${money(n)} · ${reason}`)}
function addItem(k,n=1){S.items[k]=(S.items[k]||0)+n}
function rel(n,type='familiarity'){S.milo[type]=clamp((S.milo[type]||0)+n,0,100)}
function locName(){return ({bedroom:'你的房间',living:'客厅',kitchen:'厨房',hall:'走廊',convenience:'便利店',cafe:'咖啡店',street:'街道'})[S.location]||S.location}
function miloActivity(){
  const h=Math.floor(S.minutes/60);
  if(h<9) return '还在睡觉（而且大概率已经开始打呼噜）';
  if(h<11) return '在厨房找吃的 / 磨蹭 / 看手机';
  if(h<14) return '在房间打游戏';
  if(h<17) return '出去运动或和兄弟碰面';
  if(h<20) return '在外面鬼混，偶尔回公寓拿东西';
  if(h<23) return '回到公寓打游戏、吃东西、制造噪音';
  return '睡着了；夜里会打呼噜';
}
function availableLocations(){
  return [
    ['bedroom','你的房间','休息、手机、整理、查看 Memory'],
    ['living','客厅',`公共区域；米洛状态：${miloActivity()}`],
    ['kitchen','厨房','吃东西、翻冰箱、观察室友留下的痕迹'],
    ['hall','走廊','看门、偷听、观察 NPC 是否经过'],
    ['convenience','便利店','购物、短班工作'],
    ['cafe','咖啡店','坐着休息、偶遇 NPC、观察城市'],
    ['street','街道','探索、移动、随机遇到人']
  ];
}
function dynamicHint(){
  const h=Math.floor(S.minutes/60);
  if(S.location==='living' && h>=20 && h<23 && !S.flags.miloNoise) return '客厅电视声音很大。米洛应该就在附近。';
  if(S.location==='hall' && h>=22) return '走廊里很安静。隔壁房门底下还有光。';
  if(S.location==='kitchen' && h>=8 && h<11) return '有人刚刚打开过冰箱，门还没有完全关严。';
  if(S.location==='street' && h>=17) return '远处一群年轻人经过，其中有人看起来和米洛很熟。';
  return '城市暂时没有明显异常。';
}
function renderSide(){
  document.getElementById('cash').textContent=money(S.cash);
  document.getElementById('timePlace').textContent=timeString();
  document.getElementById('placeLabel').textContent=locName();
  document.getElementById('stats').innerHTML=[`DAY ${S.day}`,`体力 ${S.energy}`,`米洛 ${S.milo.familiarity}`,`成人 ${S.adultOn?'ON':'OFF'}`,`自由行动`].map(x=>`<span class="pill">${esc(x)}</span>`).join('');
  document.getElementById('status').innerHTML=
    `<div class="item"><b>${esc(S.player.name||'未命名')}</b> · ${esc(S.player.background||'')}</div>`+
    `<div class="item">作息：${esc(S.player.schedule)} · 整洁：${esc(S.player.clean)}</div>`+
    `<div class="item">噪音容忍：${esc(S.player.noise)} · 游戏：${S.player.gaming?'喜欢':'一般'}</div>`+
    `<div class="item">体力</div><div class="meter"><div style="width:${clamp(S.energy,0,100)}%"></div></div>`;
  const inv=[['三明治','sandwich'],['饮料','drink'],['游戏手柄','gamepad'],['搞笑礼物','gift']];
  document.getElementById('inventory').innerHTML=inv.map(([label,k])=>`<div class="invrow"><span>${label}</span><b>x${S.items[k]||0}</b></div>`).join('');
  document.getElementById('relations').innerHTML=
    `<div class="item"><b>房东</b>：${S.landlordTrust}</div>`+
    `<div class="item"><b>米洛</b>：熟悉 ${S.milo.familiarity} · 信任 ${S.milo.trust} · 张力 ${S.milo.tension}</div>`+
    `<div class="item"><b>绒团团</b>：${S.tuantuan.met?'已见过':'未见'}</div>`+
    `<div class="item" style="margin-top:8px"><b>最新 Memory</b></div>`+
    (S.memories.slice(-6).reverse().map(m=>`<div class="item">• ${esc(m)}</div>`).join('')||'<div class="item muted">暂无</div>');
  document.getElementById('hidden').innerHTML=
    `<div class="item">米洛：189cm · ${esc(S.milo.skin)} · ${esc(S.milo.bodyType)}</div>`+
    `<div class="item">生活习惯：懒 ${S.milo.lazy} / 乱 ${S.milo.messy} / 脏话 ${S.milo.swearing}</div>`+
    `<div class="item">兴趣：游戏 ${S.milo.gaming} / 运动 ${S.milo.sports} / 酒吧 ${S.milo.bar}</div>`+
    `<div class="item">看脸 ${S.milo.lookDriven} / 性开放 ${S.milo.sexualOpenness}</div>`+
    `<div class="item">成人行业接触：${S.adultExposure}</div>`+
    `<div class="item">最近动态：${esc(miloActivity())}</div>`+
    `<div class="item">系统日志</div>`+
    `${S.logs.slice(0,5).map(x=>`<div class="item muted">• ${esc(x)}</div>`).join('')}`;
}
function scene(tag,speaker,text,choices=[]){
  const el=document.getElementById('scene');
  el.innerHTML=`<div class="tag">${esc(tag)}</div><div class="speaker">${speaker?esc(speaker):''}</div><div class="text">${esc(text)}</div><div class="choices" id="choices"></div>`;
  const c=document.getElementById('choices');
  choices.forEach(ch=>{const b=document.createElement('button');b.className='choice';b.textContent=ch.label;b.onclick=ch.onClick;if(ch.disabled)b.disabled=true;c.appendChild(b)});
  renderSide();
}
function start(){
  scene('START · CHARACTER CREATION','—',`这版先不追求大地图。

先把一个真正会动的 Day 1 跑起来：你自己安排时间、去不同地点、和环境互动；NPC 也会自己行动。

你不会一直被“下一段剧情”牵着走。`,[{label:'开始创角',onClick:characterSetup}]);
}
function characterSetup(){
  const el=document.getElementById('scene');
  el.innerHTML=`<div class="tag">Character Creation</div><div class="speaker">你的新生活</div>
  <div class="field"><label>名字</label><input id="pname" value="Alex" maxlength="20"></div>
  <div class="grid2">
    <div class="field"><label>性别身份</label><select id="gender"><option>男性</option><option>女性</option><option>非二元</option><option>自定义</option><option>不说明</option></select></div>
    <div class="field"><label>身体特征</label><select id="body"><option>男性身体</option><option>女性身体</option><option>双性身体</option><option>自定义</option></select></div>
    <div class="field"><label>性别表达</label><select id="expr"><option>中性</option><option>阳刚</option><option>阴柔</option><option>自定义</option></select></div>
    <div class="field"><label>性取向</label><select id="ori"><option>异性恋</option><option>同性恋</option><option>双性恋</option><option>泛性恋</option><option>无性恋</option><option>自定义</option></select></div>
    <div class="field"><label>出身</label><select id="bg"><option>普通租客</option><option>小康家庭</option><option>富裕家庭</option><option>经济困难</option><option>学生/刚毕业</option><option>社交型</option><option>独来独往</option></select></div>
    <div class="field"><label>整洁程度</label><select id="clean"><option>低</option><option selected>中等</option><option>高</option><option>极高</option></select></div>
    <div class="field"><label>作息</label><select id="schedule"><option>早起</option><option selected>普通</option><option>夜猫子</option></select></div>
    <div class="field"><label>噪音容忍</label><select id="noise"><option>低</option><option selected>中等</option><option>高</option></select></div>
  </div>
  <div class="card"><h3>兴趣</h3><button id="gameBtn" class="option" type="button" style="width:100%"><div class="main">喜欢游戏</div><div class="desc">会影响和米洛的共同活动、部分对话与习惯互动。</div></button></div>
  <div class="card"><h3>初始资源</h3><div class="small">普通开局：$180、三明治×1、饮料×1。出身只做轻微调整。</div></div>
  <div style="margin-top:16px"><button class="primary" id="beginBtn">进入 DAY 1</button></div>`;
  let game=false;document.getElementById('gameBtn').onclick=()=>{game=!game;document.getElementById('gameBtn').classList.toggle('selected',game)};
  document.getElementById('beginBtn').onclick=()=>{
    S.player.name=document.getElementById('pname').value||'Alex';S.player.gender=document.getElementById('gender').value;S.player.body=document.getElementById('body').value;S.player.expression=document.getElementById('expr').value;S.player.orientation=document.getElementById('ori').value;S.player.background=document.getElementById('bg').value;S.player.clean=document.getElementById('clean').value;S.player.schedule=document.getElementById('schedule').value;S.player.noise=document.getElementById('noise').value;S.player.gaming=game;adjustStartByBackground();apartmentArrival();
  };
  renderSide();
}
function adjustStartByBackground(){const bg=S.player.background;if(bg==='小康家庭')addCash(80,'出身资源');else if(bg==='富裕家庭')addCash(220,'出身资源');else if(bg==='经济困难')addCash(-60,'出身资源');else if(bg==='学生/刚毕业')addCash(-20,'出身资源');else if(bg==='独来独往')addCash(20,'出身资源')}
function apartmentArrival(){
  scene('DAY 1 · MOVING IN','—',`你把最后一只箱子拖上楼。

走廊比你想象得安静。
墙上的住户守则写得一丝不苟：
“公共区域保持清洁。”
“按时缴费。”
“夜间十点后降低音量。”

下面却有人用黑色水笔补了一句：
“要是忍不了，就滚出去。”

字写得很嚣张。`,[
    {label:'先去按门铃，找房东',onClick:landlordIntro},
    {label:'先敲旁边那扇门',onClick:miloDoorFirst},
    {label:'先把箱子放下，自己进去',onClick:roomIntro}
  ]);
}
function landlordIntro(){
  scene('APARTMENT · LANDLORD','艾德里安·韦尔',`“你就是今天搬进来的那个？”

他的第一眼先落在门口的鞋印上。

“钥匙。”

钥匙落进你手里。

“房租按时。公共区域别弄脏。东西别堆走廊。”

他顿了顿。

“我不喜欢重复说第二遍。”

他要走，又像想起什么似的回头：

“还有——晚上如果听到什么声音，别来找我。”`,[
    {label:'“知道了。”',onClick:()=>{S.landlordTrust+=1;addMemory('第一次见到房东：他极度在意整洁和规则。');landlordAfter}},
    {label:'“什么声音？”',onClick:()=>{S.landlordTrust+=1;S.landlordFriction+=1;S.flags.landlordAsked=true;addMemory('房东警告过夜里的声音，但拒绝解释。');landlordAfter}},
    {label:'“你这欢迎方式挺特别。”',onClick:()=>{S.landlordFriction+=1;addMemory('第一次见到房东：玩家觉得他很难相处。');landlordAfter}}
  ]);
}
function landlordAfter(){scene('APARTMENT · HALL','—',`你拿着钥匙站在走廊。

前面是你的房间。
右边那扇门下漏着一点电视光。

里面传来一声：

“操——这都能输？！”

隔了一秒，又是一个男声：

“进呗。”

但你还没敲门。`,[
  {label:'敲米洛的门',onClick:miloDoorFirst},
  {label:'直接进自己的房间',onClick:roomIntro},
  {label:'先去厨房看看',onClick:()=>enterRoam('kitchen')}
]);}
function miloDoorFirst(){
  S.location='hall';
  scene('FIRST IMPRESSION · MILO','米洛',`门只关了一半。

你敲了一下。

里面的游戏声音停了。

“进呗。”

你推门。

一个高得有点夸张的年轻男人半躺在沙发上，宽松 T 恤，手臂和肩膀的肌肉在灯下很明显。小麦色皮肤上露着一截龙纹身。

他先看你一眼，再看你脚边的箱子。

“新室友？”

没有起身帮忙。

    {label:'走过去',onClick:()=>{rel(1);scene('MILO · FRIENDS','米洛',`“哟。”

米洛转头。

“你怎么跑这来了？”

旁边的人笑了一下。

“你室友看起来比你正常。”

米洛：“放屁。”`,[{label:'留下和他们待会儿',onClick:()=>{advanceTime(30,false);addMemory('玩家第一次和米洛的朋友们见面。');openRoam('street')}},{label:'回去',onClick:()=>openRoam('street')}])}},
    {label:'远远看看就走',onClick:()=>openRoam('street')}
  ]);

function dynamicEventPool(){
  const h=Math.floor(S.minutes/60);
  const pool=[];
  if(S.flags.metMilo && S.location==='living' && h>=20 && h<23 && !S.flags.miloNoise) pool.push(miloNoiseEvent);
  if(S.flags.metMilo && S.location==='living' && h>=18 && h<21 && Math.random()<0.25) pool.push(miloBarInviteEvent);
  if(S.flags.metMilo && S.location==='hall' && h>=22 && !S.flags.day1Ended) pool.push(snoreEvent);
  return pool;
}
function maybeEvent(force=false){
  if(S.dynamicCooldown>0){S.dynamicCooldown--;return}
  const pool=dynamicEventPool();
  if(!pool.length)return;
  if(!force && Math.random()>0.45)return;
  const fn=pool[Math.floor(Math.random()*pool.length)];S.dynamicCooldown=2;fn();
}
function miloNoiseEvent(){
  S.flags.miloNoise=true;addMemory('动态事件：米洛又把游戏声音开大了。');
  scene('DYNAMIC EVENT · MILO','米洛',`电视声音突然又大起来。

“操——这波真不是我的问题。”

他骂完还笑。

显然，他又忘了自己答应过要小声。`,[
    {label:'过去提醒他',onClick:()=>{rel(1);scene('MILO · RESPONSE','米洛','“哦，操，忘了。”\n\n他把音量调低。\n\n“行了吧？”',[{label:'“行。”',onClick:()=>openRoam(S.location)}])}},
    {label:'敲墙',onClick:()=>{S.milo.tension+=1;addMemory('玩家用敲墙回应了米洛的噪音。');openRoam(S.location)}},
    {label:'不管',onClick:()=>openRoam(S.location)}
  ]);
}

function nightHook(){
  S.flags.day1Ended=true;
  scene('DAY 1 · LATE NIGHT','UNKNOWN CONTACT',`你准备睡了。

手机突然亮了一下。

【新消息】

第二条消息：
“别担心。”
“你以前也问过这个问题。”

屏幕熄灭。`,[{label:'查看 Day 1 总结',onClick:summary},{label:'进入 Day 2 预览',onClick:day2Preview}]);
}
function tryEndDay(){
  if(S.minutes<1320){
    scene('DAY 1 · CHECK','—',`现在才 ${timeString()}。

你还可以继续过这一天。

如果你主动休息到深夜，就会触发 Day 1 的收束事件。`,[{label:'休息到 23:00',onClick:()=>{const d=1320-S.minutes;advanceTime(d,false);S.energy=clamp(S.energy+20,0,100);nightHook()}},{label:'回去探索',onClick:()=>openRoam(S.location)}]);
  }else nightHook();
}
function summary(){
  scene('DAY 1 · SUMMARY','系统',`今天不是一串被推着走的剧情。

你自己安排了时间、移动、吃东西、工作、购物，甚至可能在米洛不知道的时候观察他的生活。

钱包：${money(S.cash)}
米洛：熟悉度 ${S.milo.familiarity} / 信任 ${S.milo.trust}
房东：关系 ${S.landlordTrust}
成人行业接触：${S.adultExposure}

这只是 Day 1 沙盒骨架。`,[{label:'进入 Day 2 预览',onClick:day2Preview},{label:'重新开始',onClick:()=>location.reload()}]);

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>7 DAYS WITH YOUR ROOMMATE — Day 1 Complete Prototype</title>
<style>
:root{
  --bg:#0e1014;--panel:#171a20;--panel2:#1d2129;--panel3:#12151a;--text:#f4f2ee;--muted:#9fa4ae;
  --line:#2d323c;--accent:#d9b7ff;--accent2:#9fd6ff;--good:#9dd7aa;--warn:#e7c487;--danger:#e89a9a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:radial-gradient(circle at top,#1a1d25 0,#0e1014 55%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 42px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.title{font-size:22px;font-weight:900;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);padding:7px 9px;border-radius:999px;background:#11141a;font-size:12px;color:#d9dce2}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.panel{background:rgba(23,26,32,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden}
.scene{padding:22px;min-height:460px}.tag{display:inline-block;padding:5px 8px;border-radius:7px;background:#282d37;color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.speaker{font-weight:850;color:var(--accent);margin:0 0 9px}.text{white-space:pre-wrap;line-height:1.78;font-size:16px;color:#f0eef2}.small{font-size:13px;color:var(--muted);line-height:1.65}
.choices{display:grid;gap:9px;margin-top:22px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#14171c;color:var(--text);padding:14px 15px;border-radius:12px;cursor:pointer;transition:.15s}.choice:hover{border-color:#6d7280;background:#1c2027}.choice:disabled{opacity:.5;cursor:not-allowed}
.card{border:1px solid var(--line);background:var(--panel3);border-radius:14px;padding:13px;margin-top:13px}.card h3{margin:0 0 8px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.option{border:1px solid var(--line);background:#15181e;color:var(--text);padding:12px;border-radius:12px;text-align:left;cursor:pointer}.option:hover{border-color:#767b88}.option .main{font-weight:800}.option .desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.option.selected{border-color:var(--accent2);background:#1a1f28}
.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);background:#101319;color:var(--text);padding:11px 12px;border-radius:10px;outline:none}.field input:focus,.field select:focus{border-color:#7d8290}
.primary{border:1px solid #7b5f92;background:#2a2033;color:#fff;padding:13px 14px;border-radius:11px;cursor:pointer;font-weight:800}.primary:hover{filter:brightness(1.08)}
.side{display:flex;flex-direction:column;gap:14px}.side .box{background:rgba(20,23,29,.96);border:1px solid var(--line);border-radius:16px;padding:15px}.side h4{margin:0 0 9px;font-size:12px;color:var(--muted);letter-spacing:.3px}.list{display:grid;gap:5px}.item{font-size:12px;line-height:1.45;color:#d6d9df}.item b{color:#fff}.meter{height:8px;background:#0d1015;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:5px}.meter > div{height:100%;background:#8c76a6}.money{font-size:26px;font-weight:900}.inventory{display:grid;gap:7px}.invrow{display:flex;justify-content:space-between;gap:8px;font-size:12px}.muted{color:var(--muted)}
.footer{margin-top:12px;color:var(--muted);font-size:11px;line-height:1.6}.success{color:var(--good)}.warning{color:var(--warn)}.danger{color:var(--danger)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}}
@media(max-width:560px){.side{display:block}.grid2,.grid3{grid-template-columns:1fr}.scene{min-height:0;padding:18px}.text{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">7 DAYS WITH YOUR ROOMMATE</div>
      <div class="sub">DAY 1 · Moving In · Complete Gameplay Prototype</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="layout">
    <div class="panel"><div class="scene" id="scene"></div></div>
    <div class="side">
      <div class="box"><h4>钱包</h4><div class="money" id="cash">$180</div></div>
      <div class="box"><h4>当前状态</h4><div id="status"></div></div>
      <div class="box"><h4>背包</h4><div class="inventory" id="inventory"></div></div>
      <div class="box"><h4>关系 / 记忆</h4><div id="relations"></div></div>
      <div class="box"><h4>隐藏数据（原型调试）</h4><div id="hidden"></div></div>
    </div>
  </div>

  <div class="footer">
    本原型把目前讨论过的 Day 1 核心玩法合在一起：创角、有限初始资源、房东、米洛、城市、兼职、商店、送礼、生活习惯、恶作剧、绒团团、第一次异常、Memory、灰色/成人路线入口以及 Day 2 Hook。成人路线只保留系统入口与作者文本插槽，不包含露骨正文。
  </div>
</div>
<script>
const S={
  day:1, step:0,
  player:{name:'',gender:'',body:'',expression:'',orientation:'',age:'成年',clean:'中等',schedule:'普通',noise:'中等',gaming:false,social:'中等',background:'普通租客'},
  cash:180,
  landlordName:'艾德里安·韦尔', landlordTrust:0, landlordFriction:0,
  milo:{familiarity:0,trust:0,tension:0,likedGift:false,gameBond:0},
  tuantuan:{met:false,familiarity:0},
  adultOn:true, adultExposure:0,
  energy:100, sleep:0,
  memories:[], contacts:[], items:{sandwich:1,drink:1,gamepad:0,gift:0},
  flags:{worked:false,shop:false,gifted:false,prank:false,waterSeen:false,landlordAsked:false,miloNoise:false,tuantuanMet:false,anomalySeen:false,day1Ended:false},
  logs:[]
};
const money=n=>`$${n}`;
function esc(x){return String(x).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'\\','"':'&quot;'}[m]||m));}
function addMemory(m){if(!S.memories.includes(m))S.memories.push(m);}
function log(m){S.logs.unshift(m);}
function addCash(n,reason){S.cash=Math.max(0,S.cash+n); if(reason)log(`${n>=0?'+':''}${money(n)} · ${reason}`)}
function addItem(k,n=1){S.items[k]=(S.items[k]||0)+n}
function renderSide(){
  document.getElementById('cash').textContent=money(S.cash);
  document.getElementById('stats').innerHTML=[`DAY ${S.day}`,`体力 ${S.energy}`,`房东 ${S.landlordTrust}`,`米洛 ${S.milo.familiarity}`,`成人 ${S.adultOn?'ON':'OFF'}`].map(x=>`<span class="pill">${x}</span>`).join('');
  document.getElementById('status').innerHTML=`<div class="item"><b>${esc(S.player.name||'未命名')}</b> · ${esc(S.player.background)}</div><div class="item">作息：${esc(S.player.schedule)} · 整洁：${esc(S.player.clean)}</div><div class="item">噪音容忍：${esc(S.player.noise)} · 游戏：${S.player.gaming?'喜欢':'一般'}</div><div class="item">体力</div><div class="meter"><div style="width:${Math.max(0,Math.min(100,S.energy))}%"></div></div>`;
  const inv=[['三明治','sandwich'],['饮料','drink'],['游戏手柄','gamepad'],['礼物','gift']];
  document.getElementById('inventory').innerHTML=inv.map(([label,k])=>`<div class="invrow"><span>${label}</span><b>x${S.items[k]||0}</b></div>`).join('');
  document.getElementById('relations').innerHTML=`<div class="item"><b>房东</b>：${S.landlordTrust}</div><div class="item"><b>米洛</b>：熟悉 ${S.milo.familiarity} · 信任 ${S.milo.trust}</div><div class="item"><b>绒团团</b>：${S.tuantuan.met?'已见过':'未见'}</div><div class="item" style="margin-top:8px"><b>最新 Memory</b></div>${S.memories.slice(-5).reverse().map(m=>`<div class="item">• ${esc(m)}</div>`).join('')||'<div class="item muted">暂无</div>'}`;
  document.getElementById('hidden').innerHTML=`<div class="item">成人行业接触：${S.adultExposure}</div><div class="item">联系人：${S.contacts.length}</div><div class="item">礼物已送：${S.flags.gifted?'是':'否'}</div><div class="item">异常已发现：${S.flags.anomalySeen?'是':'否'}</div>`;
}
function scene(tag,speaker,text,choices=[]){
  const el=document.getElementById('scene');
  el.innerHTML=`<div class="tag">${esc(tag)}</div><div class="speaker">${speaker?esc(speaker):''}</div><div class="text">${esc(text)}</div><div class="choices" id="choices"></div>`;
  const c=document.getElementById('choices');
  choices.forEach(ch=>{const b=document.createElement('button');b.className='choice';b.textContent=ch.label;b.onclick=ch.onClick;if(ch.disabled)b.disabled=true;c.appendChild(b)});
  renderSide();
}
function start(){
  scene('START · Character Creation','—',`先创建一个用于 Day 1 体验的成年玩家角色。正式版这里会接入完整捏人；本原型保留核心字段。`,[{label:'开始创角',onClick:characterSetup}]);
}
function characterSetup(){
  const el=document.getElementById('scene');
  el.innerHTML=`<div class="tag">Character Creation</div><div class="speaker">你的新生活</div>
  <div class="field"><label>名字</label><input id="pname" value="Alex" maxlength="20"></div>
  <div class="grid2">
    <div class="field"><label>性别身份</label><select id="gender"><option>男性</option><option>女性</option><option>非二元</option><option>自定义</option><option>不说明</option></select></div>
    <div class="field"><label>身体特征</label><select id="body"><option>男性身体</option><option>女性身体</option><option>双性身体</option><option>自定义</option></select></div>
    <div class="field"><label>性别表达</label><select id="expr"><option>中性</option><option>阳刚</option><option>阴柔</option><option>自定义</option></select></div>
    <div class="field"><label>性取向</label><select id="ori"><option>异性恋</option><option>同性恋</option><option>双性恋</option><option>泛性恋</option><option>无性恋</option><option>自定义</option></select></div>
    <div class="field"><label>出身</label><select id="bg"><option>普通租客</option><option>小康家庭</option><option>富裕家庭</option><option>经济困难</option><option>学生/刚毕业</option><option>社交型</option><option>独来独往</option></select></div>
    <div class="field"><label>整洁程度</label><select id="clean"><option>低</option><option selected>中等</option><option>高</option><option>极高</option></select></div>
    <div class="field"><label>作息</label><select id="schedule"><option>早起</option><option selected>普通</option><option>夜猫子</option></select></div>
    <div class="field"><label>噪音容忍</label><select id="noise"><option>低</option><option selected>中等</option><option>高</option></select></div>
  </div>
  <div class="card"><h3>兴趣</h3><button id="gameBtn" class="option" type="button" style="width:100%"><div class="main">喜欢游戏</div><div class="desc">会影响和米洛的共同活动、部分对话与习惯互动。</div></button></div>
  <div class="card"><h3>初始资源</h3><div class="small">普通开局：$180、三明治×1、饮料×1。出身只做轻微调整，不会给无限资金。</div></div>
  <div style="margin-top:16px"><button class="primary" id="beginBtn">进入 DAY 1</button></div>`;
  let game=false; document.getElementById('gameBtn').onclick=()=>{game=!game;document.getElementById('gameBtn').classList.toggle('selected',game)};
  document.getElementById('beginBtn').onclick=()=>{S.player.name=document.getElementById('pname').value||'Alex';S.player.gender=document.getElementById('gender').value;S.player.body=document.getElementById('body').value;S.player.expression=document.getElementById('expr').value;S.player.orientation=document.getElementById('ori').value;S.player.background=document.getElementById('bg').value;S.player.clean=document.getElementById('clean').value;S.player.schedule=document.getElementById('schedule').value;S.player.noise=document.getElementById('noise').value;S.player.gaming=game; adjustStartByBackground(); apartmentArrival();};
  renderSide();
}
function adjustStartByBackground(){
  const bg=S.player.background; if(bg==='小康家庭')addCash(80,'出身资源'); else if(bg==='富裕家庭')addCash(220,'出身资源'); else if(bg==='经济困难')addCash(-60,'出身资源'); else if(bg==='学生/刚毕业')addCash(-20,'出身资源'); else if(bg==='独来独往')addCash(20,'出身资源');
}
function apartmentArrival(){
  scene('DAY 1 · Moving In','—',`你终于把最后一只箱子拖进公寓。

城市比你想象得吵一点。

公寓则安静得有点过头。

门厅里挂着一块写得非常整齐的住户通知：

“保持公共区域清洁。”
“请按时缴费。”
“夜间十点后降低音量。”

下面还有一行手写的字：

“再犯一次，我直接把东西扔出去。”`,[{label:'按门铃，找房东',onClick:landlordIntro}]);
}
function landlordIntro(){
  scene('APARTMENT · LANDLORD','艾德里安·韦尔',`“你就是今天搬进来的那个？”

他第一眼先看你的鞋，然后看门口的地垫。

他的衣服、鞋、头发都打理得非常整齐，身上有一种明显超出普通房东的讲究感。

“钥匙。”

钥匙落进你手里。

“房租按时。公共区域别弄脏。东西别堆走廊。”

他顿了顿。

“我不喜欢重复说第二遍。”`,[
    {label:'“知道了。”',onClick:()=>{S.landlordTrust+=1;addMemory('第一次见到房东：他极度在意整洁和规则。');landlordRules();}},
    {label:'“你这欢迎方式挺特别。”',onClick:()=>{S.landlordFriction+=1;addMemory('第一次见到房东：玩家觉得他很难相处。');landlordRules();}},
    {label:'“房租具体什么时候交？”',onClick:()=>{S.landlordTrust+=2;addMemory('房东发现玩家至少愿意直接谈钱和规则。');landlordRules();}}
  ]);
}
function landlordRules(){
  scene('APARTMENT · RULES','艾德里安·韦尔',`他转身准备走，又停下来。

“还有一件事。”

“晚上如果听到什么声音——”

他侧过脸。

“别来找我。”

你问：“什么声音？”

他却只是说：

“邻居。”

然后走了。`,[{label:'进自己的房间',onClick:roomIntro}]);
}
function roomIntro(){
  scene('ROOM · FIRST LOOK','—',`你的房间很普通。

床、衣柜、书桌、一盏台灯。

窗外可以看见城市的另一条街。

手机刚连上 Wi‑Fi。

钱包：${money(S.cash)}

你突然意识到一件很现实的事：

你不能一直靠这点钱生活。`,[{label:'查看房间',onClick:roomFree}]);
}
function roomFree(){
  const choices=[
    {label:'检查冰箱',onClick:fridge},
    {label:'打开手机看看城市',onClick:cityPlan},
    {label:'直接去找工作',onClick:workChoice}
  ];
  scene('ROOM · FREE ACTION','—',`你现在可以先做一件事，然后再出门。`,[...choices]);
}
function fridge(){
  scene('ROOM · KITCHEN','—',`冰箱里只有：

三明治 × ${S.items.sandwich}
饮料 × ${S.items.drink}

隔壁房间传来“砰”的一声。

像有人把什么东西摔在桌上。`,[{label:'去看看是谁',onClick:miloIntro},{label:'先去城市',onClick:cityPlan}]);
}
function cityPlan(){
  scene('CITY · FIRST EXPLORATION','手机 / 地图',`地图上现在能看到：

• 公寓
• 便利店
• 咖啡店
• 公交站
• 一处可以立刻开始的短班工作

城市看起来非常正常。

街上甚至有长着动物头的人在等公交——没人觉得这有什么值得讨论的。`,[{label:'去便利店',onClick:shop}, {label:'去工作',onClick:workChoice},{label:'回公寓看看',onClick:miloIntro}]);
}
function workChoice(){
  if(S.flags.worked){cityAfterWork();return;}
  scene('CITY · WORK','—',`你在便利店看到一份短班工作。

工作：整理货架 / 收银 / 处理晚间补货
时长：一小段时间
收入：$45

钱不多，但很干净。`,[
    {label:'接下这份工作',onClick:()=>{S.flags.worked=true;S.energy-=18;addCash(45,'完成普通短班');addMemory('Day 1：第一次靠工作赚到钱。');cityAfterWork();}},
    {label:'先不工作',onClick:cityAfterWork}
  ]);
}
function cityAfterWork(){
  scene('CITY · AFTER WORK','—',`你现在知道一件事：

钱是有限的。

想过得舒服一点，就得决定什么时候工作、什么时候花钱。`,[{label:'去便利店买东西',onClick:shop},{label:'回公寓',onClick:miloIntro}]);
}
function shop(){
  const items=[
    ['drink','饮料',8,'自己喝，也可以送给米洛'],
    ['sandwich','三明治',12,'便宜、实用'],
    ['gamepad','游戏手柄',35,'米洛会明显感兴趣'],
    ['gift','搞笑礼物',20,'不一定讨喜，但可能形成 Memory']
  ];
  const el=document.getElementById('scene');
  el.innerHTML=`<div class="tag">CITY · SHOP</div><div class="speaker">便利店 / 小商店</div><div class="text">你站在货架前。</div><div class="grid2" style="margin-top:14px">${items.map(it=>`<button class="option" onclick="buy('${it[0]}',${it[1]})"><div class="main">${it[1]} · $${it[1]==8?'8':it[1]==12?'12':it[1]==35?'35':'20'}</div><div class="desc">${it[3]}</div></button>`).join('')}</div><div class="choices"><button class="choice" onclick="afterShop()">买完了，回去</button></div>`;
  S.flags.shop=true;renderSide();
}
window.buy=function(k,cost){if(S.cash<cost){alert('钱不够。');return;}addCash(-cost,'购物');addItem(k,1);log(`购买：${k}`);renderSide();};
window.afterShop=function(){scene('CITY · RETURN','—',`袋子里多了一点东西。

你想起那个住在隔壁的家伙。`,[{label:'回公寓',onClick:miloIntro}]);};
function miloIntro(){
  scene('APARTMENT · MILO','米洛',`你推开公共区域的门。

“砰！”

电视里刚好结束一局游戏。

一个看起来明显比你更熟悉这套公寓的男人转过头。

“哦。”

“新室友？”

他看了你两秒。

“米洛。”

然后像完全不觉得第一次见面需要客套似的：

“你会打游戏吗？”`,[
    {label:'“会。”',onClick:()=>{S.milo.familiarity+=2;S.milo.gameBond+=1;addMemory('第一次见米洛：他很自然地把打游戏当成认识新室友的方式。');miloHabit();}},
    {label:'“一般。”',onClick:()=>{S.milo.familiarity+=1;addMemory('第一次见米洛：他主动问玩家要不要一起打游戏。');miloHabit();}},
    {label:'“刚认识就问这个？”',onClick:()=>{S.milo.familiarity+=1;S.milo.tension+=1;addMemory('第一次见米洛：玩家觉得他的自来熟有点过头。');miloHabit();}}
  ]);
}
function miloHabit(){
  scene('MILO · LIFE HABIT','米洛',`米洛随手把一个手柄丢在沙发上。

“我一般晚上都在这里。”

电视还亮着。

“你要玩就直接拿。”

他又补了一句：

“哦，别碰我冰箱最右边那瓶。”

“那瓶是我的。”`,[
    {label:'“你每天都打这么久？”',onClick:()=>{S.milo.familiarity+=1;gameChoice();}},
    {label:'“那我下次问你。”',onClick:()=>{S.milo.trust+=1;gameChoice();}},
    {label:'开始翻冰箱',onClick:()=>{S.milo.tension+=1;addMemory('玩家第一次碰到米洛的私人界限：冰箱里的专属饮料。');gameChoice();}}
  ]);
}
function gameChoice(){
  const choices=[];
  if(S.items.gamepad>0)choices.push({label:'把刚买的游戏手柄给米洛',onClick:giftMiloGamepad});
  choices.push({label:'邀请米洛一起出去买东西',onClick:cityWithMilo});
  choices.push({label:'自己先回房间',onClick:homeLate});
  scene('MILO · RELATION','米洛',`米洛靠在沙发上看着你。

这个人明显很爱开玩笑，但你还没完全判断出他到底有多敏感。',choices);
}
function giftMiloGamepad(){
  S.items.gamepad--;S.flags.gifted=true;S.milo.familiarity+=2;S.milo.trust+=1;S.milo.likedGift=true;addMemory('玩家第一次送给米洛一只游戏手柄。');
  scene('GIFT · IMMEDIATE REACTION','米洛','“……给我的？”

他拿起来看了几秒。

“真的假的？”

他笑了一下。

“你还挺会送。”

他立刻把手柄接上。

“来一局？”`,[{label:'“来。”',onClick:gamingTogether},{label:'“你先玩。”',onClick:cityWithMilo}]);
}
function gamingTogether(){
  S.milo.gameBond+=2;S.milo.familiarity+=2;S.energy-=8;addMemory('玩家和米洛在 Day 1 第一次一起打游戏。');
  scene('SHARED ACTIVITY · GAMING','米洛',`你们打了一局。

输了。

米洛盯着屏幕。

“队友的问题。”

停了两秒。

“不是你。”

他自己都笑了。`,[{label:'“明明就是你。”',onClick:()=>{S.milo.familiarity+=1;cityWithMilo();}},{label:'“再来一局。”',onClick:()=>{S.milo.familiarity+=1;S.energy-=6;cityWithMilo();}}]);
}
function cityWithMilo(){
  scene('CITY · WITH MILO','米洛',`“行，走。”

米洛一边穿鞋一边说：

“顺便带你看看附近。”

你们在街上走了一圈。

他对路很熟，但有时会突然说出一些你觉得奇怪的话——像是他已经来过这里很多次。`,[{label:'“你以前是不是住过附近？”',onClick:()=>{S.milo.tension+=1;S.milo.familiarity+=1;addMemory('玩家注意到米洛对城市的熟悉程度有点过头。');homeLate();}},{label:'不追问',onClick:homeLate}]);
}
function homeLate(){
  scene('EVENING · APARTMENT','—',`晚上回到公寓。

米洛又开始打游戏。

音量逐渐变大。`,[
    {label:'让他小声点',onClick:noiseChoice},
    {label:'陪他打游戏',onClick:()=>{S.milo.familiarity+=1;gamingTogether();}},
    {label:'故意恶作剧，藏一下他的东西',onClick:prankChoice},
    {label:'回房间关门睡觉',onClick:anomalyBeforeSleep}
  ]);
}
function noiseChoice(){
  S.flags.miloNoise=true;addMemory('米洛晚上打游戏太吵，玩家第一次要求他降低音量。');
  scene('HABIT EVENT · NOISE','米洛',`“啊？”

你说：“小声一点。”

他愣了下。

“哦。”

过一会儿。

“这样？”

音量真的低了。`,[{label:'“谢了。”',onClick:anomalyBeforeSleep},{label:'“还是有点大。”',onClick:()=>{S.milo.tension+=1;anomalyBeforeSleep();}}]);
}
function prankChoice(){
  if(S.player.clean==='极高' && S.items.gamepad<=0){
    scene('PRANK','—',`你想恶作剧，但突然意识到自己其实不太喜欢碰别人乱七八糟的东西。`,[{label:'算了',onClick:anomalyBeforeSleep}]);return;
  }
  S.flags.prank=true;S.milo.familiarity+=1;addMemory('玩家在 Day 1 第一次恶作剧米洛。');
  scene('PRANK · MILO','米洛',`你把他的东西藏了起来。

三十秒后。

米洛：“……”

他转头看你。

“你干的？”

他开始笑。`,[
    {label:'承认',onClick:()=>{S.milo.trust+=1;scene('PRANK · RESPONSE','米洛',`“行。”

“你晚上最好看好自己的东西。”

他说完继续找自己的东西。`,[{label:'回房间',onClick:anomalyBeforeSleep}]);}},
    {label:'装无辜',onClick:()=>{S.milo.tension+=1;scene('PRANK · RESPONSE','米洛',`“行。”

“我记住了。”

他笑得有点太开心了。`,[{label:'回房间',onClick:anomalyBeforeSleep}]);}}
  ]);
}
function anomalyBeforeSleep(){
  scene('NIGHT · SOMETHING ODD','—',`你回到自己的房间。

冰箱门半开着。

你确定刚才离开时它是关着的。

里面多了一瓶水。

瓶身贴着一张小标签。

【${esc(S.player.name)}】

你今天第一次来到这里。

而你没把自己的名字告诉任何人。`,[
    {label:'喝掉',onClick:()=>{S.flags.anomalySeen=true;addMemory('玩家发现一瓶写着自己名字的水。');scene('ANOMALY · DRINK','—',`你喝了一口。

味道很普通。

没有任何事情发生。`,[{label:'去问米洛',onClick:askMiloAboutWater},{label:'先放回去',onClick:tuantuanNight}]);}},
    {label:'放回去',onClick:()=>{S.flags.anomalySeen=true;addMemory('玩家发现一瓶写着自己名字的水，但没有喝。');askMiloAboutWater();}},
    {label:'拍照留证',onClick:()=>{S.flags.anomalySeen=true;addMemory('玩家拍下写着自己名字的水，并保留照片。');askMiloAboutWater();}}
  ]);
}
function askMiloAboutWater(){
  scene('ANOMALY · MILO','米洛',`米洛看了一眼那瓶水。

他的表情变了很短的一瞬间。

“不是我的。”

你问：“那是谁的？”

“……不知道。”

他第一次没有马上接你的玩笑。`,[{label:'“你以前见过这种东西吗？”',onClick:()=>{S.milo.tension+=2;addMemory('米洛面对异常时第一次明显回避问题。');tuantuanNight();}},{label:'“算了。”',onClick:tuantuanNight}]);
}
function tuantuanNight(){
  scene('NIGHT · COMMON AREA','绒团团',`你准备回房时，在公共区域看见一只白兔。

粉色耳尖。

粉色尾尖。

它正抱着一个甜点。

它抬头看你。

“看什么？”`,[
    {label:'“你是谁？”',onClick:tuantuanTalk},
    {label:'“你会说话？”',onClick:tuantuanTalk},
    {label:'给它一点吃的',onClick:()=>{S.tuantuan.met=true;S.tuantuan.familiarity+=1;addMemory('玩家第一次遇见绒团团，并发现它会说话。');scene('TUANTUAN','绒团团',`它接过东西。

“你这个人还行。”

它低头继续吃。

过了几秒。

“今天第一天？”`,[{label:'“对。”',onClick:finalSleep},{label:'“你怎么知道？”',onClick:()=>{S.tuantuan.familiarity+=2;scene('TUANTUAN · ODD','绒团团',`绒团团抬头。

“……”

“猜的。”

它明显说得太快了。`,[{label:'继续',onClick:finalSleep}]);}}]);}}
  ]);
}
function tuantuanTalk(){
  S.tuantuan.met=true;S.tuantuan.familiarity+=1;addMemory('玩家第一次遇见会说话的绒团团。');
  scene('TUANTUAN','绒团团',`“你这个人问题很多。”

它抱紧了自己的甜点。

“我叫绒团团。”

“你不用知道更多。”`,[{label:'“好吧。”',onClick:finalSleep},{label:'“你为什么在这里？”',onClick:()=>{S.tuantuan.familiarity+=1;scene('TUANTUAN · ODD','绒团团',`“因为我一直都在。”

它像是说了什么普通得不能再普通的事情。`,[{label:'继续',onClick:finalSleep}]);}}]);
}
function finalSleep(){
  if(S.player.schedule==='夜猫子'){S.energy-=3;}else S.energy-=8;
  const snore=S.player.noise==='低'?'你本来就容易被声音吵醒。':S.player.noise==='高'?'隔壁的声音你几乎没在意。':'客厅里的声音渐渐听不清了。';
  scene('LATE NIGHT · MILO','—',`你躺下。

${snore}

过了很久。

隔壁突然传来——

“呼——”

停两秒。

“呼噜噜……”

米洛打呼噜了。

你盯着天花板。`,[
    {label:'忍着睡',onClick:day1End},
    {label:'敲一下墙',onClick:()=>{S.milo.familiarity+=1;addMemory('玩家第一次因为米洛的呼噜声做出反应。');day1End();}},
    {label:'录下来，明天给他听',onClick:()=>{addMemory('玩家录下米洛第一次明显的打呼噜声。');day1End();}}
  ]);
}
function day1End(){
  S.flags.day1Ended=true;
  scene('DAY 1 · END','UNKNOWN CONTACT',`你的手机屏幕亮了一下。

【新消息】

“第一天感觉怎么样？”

你没有回复。

第二条消息马上来了：

“别担心。”

“你以前也问过这个问题。”

屏幕熄灭。

DAY 1 END`,[
    {label:'查看 Day 1 总结',onClick:summary},
    {label:'进入 Day 2 预览',onClick:day2Preview},
    {label:'重新开始',onClick:()=>location.reload()}
  ]);
}
function summary(){
  scene('DAY 1 · SUMMARY','系统',`今天你经历了：

• 创建自己的角色与生活习惯
• 以有限资金开始生活
• 第一次见到房东 ${S.landlordName}
• 第一次见到米洛
• 赚到钱 / 消费 / 送礼
• 米洛的游戏、噪音、恶作剧、打呼噜等生活习惯
• 第一次见到绒团团
• 第一次发现异常物品
• 可以接触房东提供的灰色行业机会
• 成人路线由玩家主动选择（本原型只保留结构入口）
• 手机收到第一条来自未知联系人的异常消息

钱包：${money(S.cash)}
米洛：熟悉度 ${S.milo.familiarity} / 信任 ${S.milo.trust}
房东：关系 ${S.landlordTrust}
成人行业接触：${S.adultExposure}`,[{label:'进入 Day 2 预览',onClick:day2Preview}]);
}
function day2Preview(){
  scene('DAY 2 · PREVIEW','系统',`DAY 2 — SOMETHING IS WRONG

下一天正式接入：

• 诺拉首次登场
• 城市中的“有人认识你”事件
• 米洛可能暴露出更多七日周期痕迹
• 绒团团的第一次明显反常
• 手机 Memory 出现一条无法解释的旧记录
• 公寓出现第一处不能被普通常识解释的变化

第一版不把所有谜题一次解释完。`,[{label:'重新体验 Day 1',onClick:()=>location.reload()}]);
}
start();
</script>

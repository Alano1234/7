<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 DAYS WITH YOUR ROOMMATE — Day 1 Prototype</title>
<style>
:root{
  --bg:#f3eee8; --panel:#fffaf5; --panel2:#efe5db; --ink:#272323; --muted:#756a64;
  --line:#d9cbc0; --accent:#c96976; --accent2:#7c8fa8; --good:#527d67; --warn:#a16b41;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
#app{min-height:100vh;background:var(--bg);padding:20px}
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(80,55,40,.06)}
.sidebar,.phone{padding:16px}
.brand{padding:6px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand h1{font-size:18px;line-height:1.15;margin:0 0 7px;letter-spacing:.02em}
.brand p{margin:0;color:var(--muted);font-size:12px}
.statrow{display:flex;justify-content:space-between;padding:9px 10px;background:var(--panel2);border-radius:12px;margin-bottom:8px;font-size:13px}
.statrow b{font-variant-numeric:tabular-nums}
.timebar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.day{font-weight:800}.time{color:var(--muted);font-size:13px}.mainbody{padding:18px}
.location-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.location-title h2{margin:0;font-size:22px}.tag{font-size:11px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.action{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer;transition:.16s}.action:hover{transform:translateY(-1px);border-color:#c5b1a5}.action:disabled{opacity:.45;cursor:not-allowed;transform:none}.action strong{display:block;font-size:14px;margin-bottom:4px}.action span{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.event{margin-top:16px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px}.event h3{margin:0 0 7px;font-size:16px}.event p{margin:5px 0;color:#3e3835;line-height:1.55}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.choice{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}.choice:hover{border-color:#b99f91}
.log{max-height:300px;overflow:auto;margin-top:16px;padding:12px;background:#f8f2ec;border:1px solid var(--line);border-radius:14px}.log p{font-size:12px;line-height:1.5;margin:0 0 8px}.log p:last-child{margin:0}
.phone h3{margin:0 0 12px;font-size:15px}.phone-section{padding:12px 0;border-bottom:1px solid var(--line)}.phone-section:last-child{border-bottom:0}.phone-item{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0;font-size:12px}.phone-item small{color:var(--muted)}
.nav{display:grid;gap:8px}.nav button,.mini-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;text-align:left;cursor:pointer;font-size:12px}.nav button:hover,.mini-btn:hover{border-color:#b99f91}.meter{height:8px;background:#e7ddd5;border-radius:99px;overflow:hidden}.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}.rel{margin:10px 0}.relhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.muted{color:var(--muted)}
.bottom{max-width:1200px;margin:16px auto 0;padding:12px 16px;font-size:11px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(35,27,23,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}.modal.hidden{display:none}.modalbox{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.18)}.modalbox h3{margin-top:0}.close{float:right;border:0;background:transparent;font-size:20px;cursor:pointer}
@media(max-width:980px){.shell{grid-template-columns:220px minmax(0,1fr)}.phone{grid-column:1/-1}.phonegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.log{max-height:220px}}
@media(max-width:680px){#app{padding:10px}.shell{grid-template-columns:1fr}.sidebar,.phone{grid-column:auto}.grid{grid-template-columns:1fr}.phonegrid{display:block}.timebar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app">
  <div class="shell">
    <aside class="card sidebar">
      <div class="brand"><h1>7 DAYS WITH YOUR ROOMMATE</h1><p>Day 1 Prototype · “只是室友。”</p></div>
      <div class="statrow"><span>现金</span><b id="money">$120</b></div>
      <div class="statrow"><span>时间</span><b id="slot">早晨</b></div>
      <div class="statrow"><span>异常感</span><b id="odd">0</b></div>
      <div class="statrow"><span>天数</span><b>Day 1 / 7</b></div>
      <div class="phone-section"><h3>地点</h3><div class="nav" id="nav"></div></div>
      <div class="phone-section"><h3>设计目标</h3><div class="muted">没有必须完成的任务。你只是住进来了。</div></div>
    </aside>

    <main class="card">
      <div class="timebar"><div><span class="day">DAY 1</span> · <span id="weather">天气晴</span></div><div class="time" id="timeText">08:00 — 12:00</div></div>
      <div class="mainbody">
        <div class="location-title"><h2 id="place">公寓</h2><span class="tag" id="placeTag">你的新住处</span></div>
        <div class="grid" id="actions"></div>
        <div class="event" id="eventBox"></div>
        <div class="log" id="log"></div>
      </div>
    </main>

    <aside class="card phone">
      <div class="phonegrid">
        <div class="phone-section"><h3>📱 手机</h3><div class="phone-item"><span>Wallet</span><b id="wallet">$120</b></div><div class="phone-item"><span>Messages</span><small id="messages">0 new</small></div><div class="phone-item"><span>Memory</span><small id="memoryCount">0</small></div></div>
        <div class="phone-section"><h3>❤️ 关系</h3><div class="rel"><div class="relhead"><span>米洛</span><b id="miloRel">0</b></div><div class="meter"><i id="miloMeter" style="width:0%"></i></div></div><div class="rel"><div class="relhead"><span>绒团团</span><b id="tuantuanRel">0</b></div><div class="meter"><i id="tuantuanMeter" style="width:0%"></i></div></div></div>
        <div class="phone-section"><h3>🎒 背包</h3><div id="inv" class="muted">空空的。</div></div>
        <div class="phone-section"><h3>📓 Memory</h3><div id="memList" class="muted">还没有特别的记忆。</div></div>
      </div>
    </aside>
  </div>
  <div class="card bottom">原型目标：让玩家在没有任务箭头的情况下，自主决定“今天怎么过”。部分事件为随机抽取；关系、钱、物品、记忆都会留下。</div>
</div>

<div class="modal hidden" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><h3 id="modalTitle"></h3><div id="modalText"></div><div class="choices" id="modalChoices"></div></div></div>

<script>
const state={
  money:120, slot:0, location:'公寓', odd:0, messages:0,
  relationships:{'米洛':0,'绒团团':0}, inventory:[], memories:[], flags:{miloMet:false,tuantuanMet:false,kitchenLight:false,worked:false,coffee:false,pranked:false},
  weather:'晴'
};
const slots=[['早晨','08:00 — 12:00'],['午后','12:00 — 17:00'],['傍晚','17:00 — 22:00'],['深夜','22:00 — 02:00']];
const locations={
  '公寓':{tag:'你的新住处',actions:[
    ['找米洛','看看他在干什么。',()=>meetMilo()],
    ['找绒团团','看看那只会说话的兔子。',()=>meetTuantuan()],
    ['整理房间','把陌生的房间变得像自己的。',()=>roomAction()],
    ['在厨房待一会儿','吃点东西，或者发现一点东西。',()=>kitchenAction()],
    ['看手机','看看有没有新消息。',()=>phoneAction()],
    ['休息','什么都不做也没关系。',()=>restAction()],
  ]},
  '便利店':{tag:'24 小时营业',actions:[
    ['买咖啡','-$4。提升一点状态。',()=>buy('咖啡',4,0)],
    ['买零食','-$3。绒团团可能会喜欢。',()=>buy('零食',3,0)],
    ['找兼职','赚 $28，并可能遇到奇怪的人。',()=>workAction()],
    ['观察店里','不消费也可以看看。',()=>storeAction()],
  ]},
  '咖啡店':{tag:'总有人坐在窗边',actions:[
    ['点咖啡','-$6。',()=>buy('咖啡店咖啡',6,0)],
    ['坐窗边','随机遇到一个人。',()=>cafeEncounter()],
    ['找兼职','赚 $24。',()=>cafeWork()],
  ]},
  '河岸':{tag:'白天很普通',actions:[
    ['散步','没有明确目的。',()=>riverWalk()],
    ['拍照','把今天留下一点证据。',()=>photoAction()],
    ['仔细观察','可能发现不该出现的东西。',()=>anomalyAction()],
  ]}
};
function el(id){return document.getElementById(id)}
function addLog(t){const p=document.createElement('p');p.textContent=t;el('log').prepend(p)}
function rel(n,d){state.relationships[n]=Math.max(-20,Math.min(100,state.relationships[n]+d));}
function mem(t){if(!state.memories.includes(t)){state.memories.push(t)}}
function item(t){if(!state.inventory.includes(t))state.inventory.push(t)}
function spend(n){if(state.money<n){showModal('钱不够','钱包里只有 $'+state.money+'。');return false}state.money-=n;return true}
function advance(){state.slot++; if(state.slot>=slots.length){state.slot=slots.length-1; showEndDay();} render();}
function action(fn){fn();}
function showModal(title,text,choices=[]){el('modalTitle').textContent=title;el('modalText').innerHTML=text;const c=el('modalChoices');c.innerHTML='';choices.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x.label;b.onclick=x.fn;c.appendChild(b)});el('modal').classList.remove('hidden')}
function closeModal(){el('modal').classList.add('hidden')}
function meetMilo(){
  if(!state.flags.miloMet){state.flags.miloMet=true;rel('米洛',10);mem('Day 1：第一次见到米洛。');addLog('米洛："你就是新来的？房间别乱碰，我昨晚刚整理……算了，我根本没整理。"');showModal('米洛','一个穿得很潮的男生从沙发上坐起来。桌上有游戏手柄、半杯没喝完的饮料，以及一堆明显拖了很久没收的衣服。<br><br>他看了你一眼。<br>“一起打两把？”',[{label:'好啊',fn:()=>{rel('米洛',4);mem('和米洛一起打了游戏。');addLog('你和米洛打了两把游戏。他输了以后说是手柄的问题。');closeModal();advance();}},{label:'不了，我先熟悉一下',fn:()=>{rel('米洛',1);addLog('米洛耸耸肩：“行，反正我等一下也要睡觉。”');closeModal();advance();}}]);return}
  if(spend(0)){rel('米洛',2);showModal('客厅','米洛正在玩游戏。','');addLog('米洛：“你来了？坐。”');closeModal();advance();}
}
function meetTuantuan(){
  if(!state.flags.tuantuanMet){state.flags.tuantuanMet=true;rel('绒团团',8);mem('Day 1：第一次和绒团团说话。');addLog('绒团团从沙发下面钻出来：“你终于来了。(・ω・)”');showModal('绒团团','一只白兔抬头看着你。<br><br>“你是新住户。”<br><br>“嗯……欢迎。”<br><br>它看了你两秒。<br>“这个房间昨天不是这样。”',[{label:'“你会说话？”',fn:()=>{state.odd+=1;addLog('你问它会不会说话。它表示这不是重点。');closeModal();advance();}},{label:'“什么叫昨天不是这样？”',fn:()=>{state.odd+=2;mem('绒团团说：这个房间昨天不是这样。');addLog('绒团团：“哦，你已经注意到了。”');closeModal();advance();}}]);return}
  rel('绒团团',1);addLog('绒团团：“我要草莓。(╥﹏╥)”');advance();
}
function roomAction(){state.money+=0;addLog('你把箱子拆开，发现一张不知道是谁留下的旧票根。');item('旧票根');mem('房间里有一张不属于自己的旧票根。');showModal('房间','票根上的日期很旧，但地址正是这栋公寓。',[{label:'收进收藏',fn:()=>{state.odd+=1;closeModal();advance()}},{label:'丢掉',fn:()=>{addLog('你把票根扔进垃圾桶。');closeModal();advance()}}]);}
function kitchenAction(){
  if(!state.flags.kitchenLight){state.flags.kitchenLight=true;state.odd+=1;mem('厨房灯似乎被提前换过。');addLog('厨房的灯突然闪了一下。米洛从客厅喊：“哦，又来了。”');showModal('厨房灯','灯闪烁了两次，然后恢复正常。你确认自己没有碰开关。<br><br>米洛：“别管它，等一下自己就好了。”',[{label:'问米洛“又来了是什么意思？”',fn:()=>{rel('米洛',1);addLog('米洛沉默两秒：“……我随口说的。”');closeModal();advance()}},{label:'记下来',fn:()=>{state.odd+=1;closeModal();advance()}}]);return}
  addLog('厨房灯今天暂时没有再闪。');advance();
}
function phoneAction(){state.messages=0;addLog('手机里只有一条来自未知号码的空白消息。');state.odd+=1;mem('Day 1：收到来自未知号码的空白消息。');advance();}
function restAction(){addLog('你决定什么都不做。居然感觉很好。');advance();}
function buy(name,cost){if(!spend(cost))return;item(name);addLog('购买了 '+name+'，花费 $'+cost+'。');if(name==='零食'&&state.flags.tuantuanMet){rel('绒团团',6);mem('给绒团团买过零食。');addLog('绒团团：“这个归我。”')};advance()}
function workAction(){if(state.flags.worked){addLog('你今天已经做过这份兼职了。');advance();return}state.flags.worked=true;state.money+=28;addLog('你完成了便利店兼职，赚到 $28。');if(Math.random()<.7){state.odd+=1;mem('兼职时遇见一个奇怪的客人。');showModal('兼职','凌晨前，一个戴着兔耳帽的人来买牛奶。他结账时说：<br><br>“你是不是第一天住进那栋楼？”',[{label:'“你认识我？”',fn:()=>{state.odd+=1;closeModal();advance()}},{label:'装作没听见',fn:()=>{closeModal();advance()}}]);}else advance();}
function storeAction(){if(Math.random()<.5){addLog('店员正在和空气聊天。你决定暂时不问。');state.odd+=1}else addLog('便利店很正常。至少表面上如此。');advance()}
function cafeEncounter(){if(state.flags.miloMet&&Math.random()<.6){addLog('米洛正好也在咖啡店。他看见你：“你还挺会找地方躲。”');rel('米洛',2)}else addLog('窗边有人留下一杯没有人认领的咖啡。');advance()}
function cafeWork(){if(state.money<0)state.money=0;state.money+=24;addLog('咖啡店兼职结束，赚到 $24。');advance()}
function riverWalk(){if(Math.random()<.65)addLog('你沿河走了一圈。什么怪事都没有。');else{state.odd+=1;addLog('你发现一只白兔从河对岸看着你，然后在你眨眼之后消失。');}advance()}
function photoAction(){item('河岸照片');mem('拍下了 Day 1 的河岸。');addLog('拍下一张河岸照片。照片里远处似乎多了一个人。');if(Math.random()<.4)state.odd+=1;advance()}
function anomalyAction(){state.odd+=2;showModal('河岸','河面上漂着一张门牌号。<br><br>门牌号：<b>7</b><br><br>你低头看手机，地图上却没有任何编号为 7 的地址。',[{label:'拍下来',fn:()=>{item('奇怪门牌号照片');mem('河岸出现过不存在的 7 号门牌。');closeModal();advance()}},{label:'捞起来',fn:()=>{item('旧门牌号');mem('从河里捞出了一块写着 7 的门牌。');closeModal();advance()}}]);}
function prank(){if(!state.flags.miloMet){showModal('提示','先认识米洛。');return}if(state.flags.pranked){addLog('你已经恶作剧过米洛一次了。');advance();return}state.flags.pranked=true;rel('米洛',3);mem('Day 1：往米洛的房间里藏了一只袜子。');addLog('你把一只袜子藏进米洛的床边。米洛晚些时候发现了。');state.messages+=1;showModal('报复预告','米洛盯着你。<br><br>“行。”<br>“你今晚最好睡得安稳。”',[{label:'“怕你啊。”',fn:()=>{rel('米洛',3);closeModal();advance()}},{label:'假装无辜',fn:()=>{closeModal();advance()}}]);}
function showEndDay(){showModal('Day 1 即将结束','你已经把今天最后一个时间段用掉了。<br><br>这一周才刚刚开始。<br><br><b>当前原型不会真正进入 Day 2。</b><br>它的目的只是验证：即使没有主线任务，玩家也愿意自己找事情做。',[{label:'继续看看状态',fn:()=>closeModal()}]);}
function render(){
  el('money').textContent='$'+state.money;el('wallet').textContent='$'+state.money;el('slot').textContent=slots[state.slot][0];el('timeText').textContent=slots[state.slot][1];el('odd').textContent=state.odd;el('miloRel').textContent=state.relationships['米洛'];el('tuantuanRel').textContent=state.relationships['绒团团'];el('miloMeter').style.width=Math.max(0,state.relationships['米洛'])+'%';el('tuantuanMeter').style.width=Math.max(0,state.relationships['绒团团'])+'%';el('messages').textContent=state.messages?state.messages+' new':'0 new';el('memoryCount').textContent=state.memories.length;
  el('inv').innerHTML=state.inventory.length?state.inventory.map(x=>'• '+x).join('<br>'):'空空的。';el('memList').innerHTML=state.memories.length?state.memories.slice(-5).reverse().map(x=>'• '+x).join('<br>'):'还没有特别的记忆。';
  el('place').textContent=state.location;el('placeTag').textContent=locations[state.location].tag;
  el('nav').innerHTML='';Object.keys(locations).forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.disabled=l===state.location;b.onclick=()=>{state.location=l;addLog('你前往了'+l+'。');render()};el('nav').appendChild(b)});
  const ac=el('actions');ac.innerHTML='';locations[state.location].actions.forEach(x=>{const b=document.createElement('button');b.className='action';b.innerHTML='<strong>'+x[0]+'</strong><span>'+x[1]+'</span>';b.onclick=x[2];ac.appendChild(b)});
  if(state.location==='公寓'){const b=document.createElement('button');b.className='action';b.innerHTML='<strong>恶作剧：藏袜子</strong><span>米洛可能会记住这件事。</span>';b.onclick=prank;ac.appendChild(b)}
  el('eventBox').innerHTML='<h3>今天没有“主线任务”。</h3><p>你可以自由活动。时间会过去，NPC 会记住你做过的事情，城市偶尔会说一些不该说的话。</p><div class="muted">当前地点：'+state.location+' · '+slots[state.slot][0]+'</div>';
}
addLog('搬进公寓。米洛说：“厨房灯要是闪了，别管。”');render();
</script>
</body>
</html>

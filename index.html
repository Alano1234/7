<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7 DAYS WITH YOUR ROOMMATE — Combined Vertical Slice</title>
<style>
:root{
  --bg:#f4f0eb;--panel:#fffdf9;--panel2:#efe6dd;--ink:#292522;--muted:#847b74;
  --line:#e3d9d0;--accent:#7e695b;--accent2:#c9897d;--shadow:#00000012;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
#app{min-height:100vh;background:var(--panel);box-shadow:0 18px 70px var(--shadow)}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:#fffdf9ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-size:12px;font-weight:900;letter-spacing:.08em}
.sub{font-size:10px;color:var(--muted);margin-top:3px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:10px}
.wrap{padding:14px 14px 92px;max-width:1280px;margin:auto}
.hero{padding:20px;border-radius:23px;background:linear-gradient(135deg,#eee4db,#d9c8ba);border:1px solid #ddcfc4}
.hero small{letter-spacing:.12em;color:#74685f}
.hero h1{margin:15px 0 8px;font-size:30px;line-height:1.05}
.hero p{margin:0;max-width:850px;color:#5e564f;font-size:13px;line-height:1.65}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 280px;gap:12px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:12px}
.sidebar,.phone{align-self:start}
.side-section{padding:10px 2px;border-bottom:1px solid var(--line)}
.side-section:last-child{border-bottom:0}
.side-title{font-size:11px;font-weight:800;margin-bottom:9px}
.statrow{display:flex;justify-content:space-between;padding:8px 9px;background:var(--panel2);border-radius:11px;margin:6px 0;font-size:11px}
.statrow b{font-variant-numeric:tabular-nums}
.nav{display:grid;gap:6px}
.nav button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 9px;text-align:left;font-size:10px}
.nav button:hover{border-color:#bba79a}
.nav button.active{background:var(--panel2);font-weight:800}
.muted{color:var(--muted)}
.progress{height:7px;background:#e9e1da;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent2);border-radius:99px}
.sceneHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sceneHead h2{margin:0;font-size:18px}
.tag{font-size:9px;color:var(--muted);padding:5px 7px;border:1px solid var(--line);border-radius:99px}
.sceneVisual{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:16px;color:#fff;min-height:78px;margin-bottom:11px;box-shadow:inset 0 0 0 1px #ffffff33}
.sceneEmoji{font-size:32px;flex:none}
.sceneVisual b{display:block;font-size:12px}
.sceneVisual small{display:block;margin-top:4px;font-size:9px;line-height:1.45;opacity:.91}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.act{padding:11px;border-radius:13px;border:1px solid var(--line);background:#faf6f2;text-align:left;min-height:58px}
.act:hover{border-color:#b9a295;transform:translateY(-1px)}
.act:disabled{opacity:.42;cursor:not-allowed;transform:none}
.act b{display:block;font-size:11px}
.act small{display:block;color:var(--muted);font-size:9px;margin-top:3px;line-height:1.35}
.log{margin-top:10px;max-height:245px;overflow:auto}
.log div{padding:8px 9px;margin-bottom:6px;background:#faf7f3;border:1px solid #eee8df;border-radius:11px;font-size:10px;line-height:1.45}
.log b{display:block;color:#897466;margin-bottom:3px;font-size:8px}
.phone h3{font-size:12px;margin:0 0 9px}
.phone-section{padding:8px 0 11px;border-bottom:1px solid var(--line)}
.phone-section:last-child{border-bottom:0}
.phone-item{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:7px 0;font-size:10px}
.phone-item small{color:var(--muted)}
.rel{margin:9px 0}
.relhead{display:flex;justify-content:space-between;font-size:10px;margin-bottom:5px}
.meter{height:7px;background:#ece6e0;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini{padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff}
.mini b{font-size:10px}
.mini p{font-size:9px;color:var(--muted);line-height:1.45;margin:4px 0 0}
.dock{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(1000px,calc(100% - 18px));padding:6px;background:#fffdf9ef;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;box-shadow:0 10px 30px #0001;backdrop-filter:blur(12px);z-index:19}
.dock button{border:0;background:transparent;padding:8px 4px;border-radius:10px;font-size:9px;color:#827970}
.dock button.active{background:var(--panel2);color:#3d3530;font-weight:800}
.modal{position:fixed;inset:0;background:#2b241f66;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:40}
.modal.show{display:flex}
.sheet{width:min(700px,100%);max-height:84vh;overflow:auto;background:#fffdf9;border-radius:22px;padding:15px;border:1px solid var(--line);box-shadow:0 25px 80px #0003}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mh h3{margin:0;font-size:14px}
.close{width:31px;height:31px;border:0;border-radius:9px;background:#eee8e0}
.story{font-size:13px;line-height:1.85;white-space:pre-wrap}
.choices{display:grid;gap:7px;margin-top:12px}
.choice{padding:10px 11px;border-radius:12px;border:1px solid var(--line);background:#f8f4f0;text-align:left;font-size:10px}
.choice:hover{border-color:#b59f92}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:9px;background:#faf7f3}
.ico{width:40px;height:40px;border-radius:11px;background:#eee2d7;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.item b{font-size:10px}.item small{display:block;color:var(--muted);font-size:8px;line-height:1.3;margin-top:2px}
.buy{margin-left:auto;padding:7px 9px;border:0;border-radius:8px;background:#3d3631;color:#fff;font-size:8px}
.buy:disabled{background:#c5beb8}
.intro{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.introbox{width:min(540px,100%);padding:24px;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 20px 70px #00000012}
.introbox h2{font-size:28px;line-height:1.05;margin:10px 0}.introbox p{font-size:11px;color:#756d65;line-height:1.7}
.introbox input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);outline:0;margin:6px 0 10px}
.primary{width:100%;padding:13px;border:0;border-radius:12px;background:#403934;color:#fff;font-weight:800}
.badge{display:inline-block;font-size:8px;padding:4px 6px;border-radius:99px;background:#f1e8df;color:#705f52}
@media(max-width:980px){.shell{grid-template-columns:1fr 260px}.sidebar{grid-column:1/-1}.sidegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.shell{grid-template-columns:1fr}.phone{grid-column:auto}.sidegrid{grid-template-columns:1fr}.actions,.shop{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.hero h1{font-size:24px}.wrap{padding:11px 10px 88px}.top{padding:11px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const KEY='7days_combined_v03';
const state={
 name:'',day:1,slot:0,money:120,energy:5,oddity:0,location:'公寓',weather:'晴',
 rel:{milo:0,nora:0,unknown:0,bun:0},trust:{milo:0,nora:0,unknown:0},
 inventory:[],memories:[],log:[],messages:[],flags:{},finished:false
};
const times=[['09:00','早晨'],['12:30','午后'],['16:30','傍晚前'],['20:00','晚上'],['00:10','深夜']];
const places={
 '公寓':{tag:'你的新住处',art:['🏠','#e0d1c3,#f4ece5'],desc:'暖灯、沙发和一扇总有人忘记关的门'},
 '便利店':{tag:'24 小时营业',art:['🧾','#d7cfc5,#eee8df'],desc:'荧光灯、收银机和永远整理不完的货架'},
 '咖啡店':{tag:'总有人坐在窗边',art:['☕','#cfbdb0,#ede0d6'],desc:'窗边的位置总有人坐过，杯沿还有一点水汽'},
 '河岸':{tag:'白天很普通',art:['🌙','#27333e,#6f7c84'],desc:'桥灯落在水面上，像一条被拉长的白线'},
 '商场':{tag:'以后会变得更大',art:['🛍️','#d8cdc3,#eee6dd'],desc:'漂亮橱窗里，有些东西明明不该出现在这里'}
};
const shopItems=[
 ['coffee','☕','冷萃咖啡',6,'今天也许值得清醒一点。'],
 ['snack','🍓','草莓糖',5,'绒团团会记住。'],
 ['lamp','🪔','暖灯',25,'放进房间，夜晚会改变一些东西。'],
 ['miloGift','🎮','游戏挂件',18,'米洛看见会嘴硬。'],
 ['noraGift','🪞','极简香氛',22,'诺拉看到会停一下。'],
 ['coat','🧥','宽松外套',45,'让你更像这里的人。']
];
function $(id){return document.getElementById(id)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)Object.assign(state,x)}catch(e){}}
function has(id){return state.inventory.includes(id)}
function addItem(id){if(!has(id))state.inventory.push(id)}
function mem(txt){if(!state.memories.includes(txt))state.memories.push(txt)}
function addLog(title,txt){state.log.unshift({d:state.day,t:title,x:txt});state.log=state.log.slice(0,30)}
function rel(k,n){state.rel[k]=Math.max(-20,Math.min(100,state.rel[k]+n))}
function relText(v){return v<2?'刚认识':v<5?'有点熟':v<9?'越来越熟':v<13?'关系微妙':'很亲近'}
function energyUse(){if(state.energy<=0){alert('今天已经有点累了。');return false}state.energy--;return true}
function sceneArt(kind,label,detail){
 const p=places[kind]||places.公寓;
 return `<div class="sceneVisual" style="background:linear-gradient(135deg,${p.art[1]})"><span class="sceneEmoji">${p.art[0]}</span><div><b>${label||kind}</b><small>${detail||p.desc}</small></div></div>`;
}
function sheet(title,html,choices=[]){
 $('sheet').innerHTML=`<div class="mh"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${html}`;
 if(choices.length){
   const wrap=document.createElement('div');wrap.className='choices';
   choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c[0];b.onclick=()=>{c[1]?.();save();closeModal();render()};wrap.appendChild(b)});
   $('sheet').appendChild(wrap);
 }
 $('modal').classList.add('show');
}
function closeModal(){$('modal').classList.remove('show')}
function openIntro(){
 document.body.insertAdjacentHTML('beforeend',`<div class="intro" id="intro"><div class="introbox">
 <div class="logo">7 DAYS WITH YOUR ROOMMATE</div>
 <h2>你不是来做题的。<br>你是来住一周的。</h2>
 <p>这一版把两个原型合并：<b>完整七日剧情 + 更自由的生活循环 + 地点导航 + 异常感 + 恶作剧 + 手机 / 钱包 / 记忆。</b></p>
 <input id="nameInput" placeholder="你的名字" maxlength="18">
 <button class="primary" onclick="startGame()">搬进去</button>
 <p style="font-size:9px;text-align:center;margin-bottom:0">Standalone HTML · 不需要外部资源</p>
 </div></div>`);
}
function startGame(){state.name=($('nameInput').value||'你').trim();addLog('开始','你搬进这套公寓。房东说：先住一周，觉得合适，就继续住。');save();$('intro')?.remove();render();setTimeout(openPrologue,100)}
function openPrologue(){
 sheet('PROLOGUE · 你为什么会住进这里？',`${sceneArt('公寓','搬进来的第一天','新的城市、新的钥匙、一周的临时住处。')}<div class="story">你把最后一个箱子放在门边。

房东说：“先住一周。觉得合适，就继续住。”

听起来再普通不过。

可你还是有一种奇怪的感觉——像是自己并不是“找到”了这套房子，而是被它刚好接住了。</div>`,[
 ['我只是想换个环境',()=>{mem('你搬来这里，是因为想换个环境。')}],
 ['我本来就只打算住一周',()=>{mem('你一开始就没打算住很久。')}],
 ['我想离一些人远一点',()=>{mem('你没有告诉别人，你为什么想离开原来的生活。')}]
 ]);
}
function nextSlot(){
 if(state.finished)return;
 if(state.day===7&&state.slot===times.length-1){state.finished=true;save();showEnding();return}
 if(state.slot<times.length-1){state.slot++;state.energy=Math.max(0,state.energy-1)}
 else{state.day++;state.slot=0;state.energy=5;state.money+=18;state.weather=['晴','多云','小雨','晴'][Math.floor(Math.random()*4)];addLog('生活','睡了一觉。今天到账 $18。')}
 save();render();
}
function doAction(fn){fn()}
function mainEvent(){
 if(state.day===1&&!state.flags.milo){
   state.flags.milo=true;rel('milo',1);mem('Day 1：第一次见到米洛。');
   sheet('DAY 1 · 你终于见到米洛',`${sceneArt('公寓','客厅 · 17:04','游戏声音从半掩着的房门里漏出来。')}<div class="story">你把最后一个箱子拖进客厅。

米洛从游戏里抬头。

“你就是新来的？”

他看了一眼你的行李。

“行李这么少？你准备只住一周，还是七天以后跑路？”

你还没回答，他就笑了。

“别紧张。我很好相处。”

停半秒。

“……大部分时候。”

门口的绒团团突然打了个喷嚏。</div>`,[
 ['“你这是在欢迎我吗？”',()=>rel('milo',1)],
 ['“冰箱那格我不会动。”',()=>{rel('milo',2);state.trust.milo+=1}],
 ['先去看那只白兔。',()=>{rel('bun',1);state.oddity+=1}]
 ]);return;
 }
 if(state.day===2&&!state.flags.nora&&state.slot>=2){
   state.flags.nora=true;rel('nora',1);mem('Day 2：诺拉第一次回到公寓。');
   sheet('DAY 2 · 诺拉回来了',`${sceneArt('公寓','玄关 · 18:20','门锁轻响。一个人站在门口看了你两秒。')}<div class="story">诺拉回到公寓，把钥匙放下。

“你是昨天搬进来的？”

“诺拉。”

她扫了一眼地面。

“米洛是不是又把鞋扔这里？”

你低头。真的有。

她闭了闭眼。

“……很好。”

然后她问：

“晚饭吃什么？”

这是她第一次主动把你算进自己的生活。</div>`,[
 ['“你想吃什么？”',()=>{rel('nora',2);state.trust.nora+=1}],
 ['“出去吃，我请。”',()=>rel('nora',1)],
 ['“我做一点，你吃辣吗？”',()=>{rel('nora',2);state.trust.nora+=1}]
 ]);return;
 }
 if(state.day===2&&!state.flags.light&&state.slot>=3){
   state.flags.light=true;state.oddity+=1;mem('绒团团说厨房灯昨天就坏过。');
   sheet('DAY 2 · 23:57',`${sceneArt('公寓','厨房 · 深夜','只有一盏灯还亮着。')}<div class="story">你去厨房倒水。

灯闪了一下。

又一下。

绒团团抬起头。

“你刚刚也看到了？”

“什么？”

“灯呀。”

它低头吃了一口草莓。

“这盏灯明明是昨天才坏掉的。”

你突然停住。

你昨天根本还没住进来。</div>`,[
 ['追问“你昨天在哪里？”',()=>{state.oddity+=1;rel('bun',1)}],
 ['当没听见。',()=>{}],
 ['拍下来。',()=>{addItem('厨房灯照片');mem('你拍下了那盏有问题的厨房灯。')}]
 ]);return;
 }
 if(state.day===3&&!state.flags.unknown){
   state.flags.unknown=true;rel('unknown',1);
   sheet('DAY 3 · 陌生消息',`${sceneArt('公寓','手机亮了一下','没有头像，也没有备注。只有一句话。')}<div class="story">【陌生号码】

“你也看到那盏灯了？”

没有头像。

没有第二条消息。

米洛从客厅经过。

“谁给你发消息？”

你把手机扣下。

他看了你一眼。

走两步。

又停下来。

“……如果你准备去问那件事，先跟我说。”</div>`,[
 ['把消息给米洛看。',()=>{rel('milo',2);state.trust.milo+=1}],
 ['先藏着。',()=>rel('unknown',1)],
 ['去找诺拉。',()=>{rel('nora',2)}]
 ]);return;
 }
 if(state.day===4&&!state.flags.d4){
   state.flags.d4=true;
   sheet('DAY 4 · 米洛知道得比你想的多',`${sceneArt('公寓','客厅 · 21:14','电视没开，只有游戏主机的待机灯还亮着。')}<div class="story">你把那张车票放在桌上。

米洛看见它之后，第一次没有开玩笑。

“你从哪弄到的？”

“河边。”

他沉默了一会儿。

“……这个地方以前没有河。”

你：“你刚刚说什么？”

他抬眼。

“没什么。”

然后他把车票推回你面前。

“别把它丢了。”</div>`,[
 ['逼他解释。',()=>{rel('milo',2);state.trust.milo+=1}],
 ['先把票收起来。',()=>addItem('无日期车票')],
 ['问“你以前来过这里？”',()=>{rel('milo',1);mem('米洛似乎经历过“以前”的城市。')}]
 ]);return;
 }
 if(state.day===5&&!state.flags.d5){
   state.flags.d5=true;
   sheet('DAY 5 · 诺拉终于说了一点',`${sceneArt('公寓','阳台 · 22:03','城市的灯在远处一盏一盏亮起来。')}<div class="story">诺拉站在阳台上。

你走过去，她没有回头。

“你是不是已经发现了？”

“发现什么？”

“这套房子不太对。”

她笑了一下。

“我第一次住进来的时候，也这么问过。”

你愣住。

她终于看向你。

“但我只住到第七天。”</div>`,[
 ['“那第七天发生了什么？”',()=>{rel('nora',2);state.trust.nora+=1}],
 ['“你以前住过这里？”',()=>{rel('nora',1);state.oddity+=1}],
 ['不追问。',()=>{}]
 ]);return;
 }
 if(state.day===6&&!state.flags.d6){
   state.flags.d6=true;
   sheet('DAY 6 · 所有人都在',`${sceneArt('公寓','停电后的客厅','整栋楼突然停电。手机成为唯一的光。')}<div class="story">晚上九点十七分，整栋楼停电。

米洛、诺拉和你第一次同时站在客厅。

绒团团蹲在桌子上。

谁都没有说话。

三秒后，绒团团开口：

“你们是不是忘了？”

米洛：“忘了什么？”

绒团团看着你。

“第七天。”

窗外突然重新亮起来。

桌上多了一张照片。

照片里，是你们三个站在这里。

照片背面只有一行字：

“别让他们在第七天分开。”</div>`,[
 ['拿起照片。',()=>{addItem('三人照片');mem('第六天停电后，桌上出现了三个人的照片。')}],
 ['先问米洛。',()=>rel('milo',2)],
 ['先问诺拉。',()=>rel('nora',2)]
 ]);return;
 }

      <div class="statrow"><span>天气</span><b>${state.weather}</b></div>
    </div>
    <div class="side-section"><div class="side-title">地点</div><div class="nav">${Object.keys(places).map(p=>`<button class="${p===state.location?'active':''}" onclick="visit('${p}')">${p}</button>`).join('')}</div></div>
    <div class="side-section"><div class="side-title">今天</div><div class="muted" style="font-size:10px;line-height:1.55">没有必须完成的任务。你只是在这里生活。<br><span class="badge">异常事件会随机出现</span></div></div>
   </div></aside>
   <main class="card"><div class="sceneHead"><h2>${state.location}</h2><span class="tag">${loc.tag}</span></div>
     ${sceneArt(state.location,state.location,loc.desc)}
     <div class="actions" id="actions"></div>
     <h3 style="font-size:11px;margin:13px 0 8px">最近发生</h3><div class="log">${state.log.length?state.log.map(x=>`<div><b>DAY ${x.d} · ${x.t}</b>${escapeHtml(x.x)}</div>`).join(''):'<div><b>DAY 1</b>你刚搬进来。</div>'}</div>
   </main>
   <aside class="card phone"><div class="phone-section"><h3>📱 手机</h3>
     <div class="phone-item"><span>Wallet</span><b>$${state.money}</b></div>
     <div class="phone-item"><span>Chat</span><small>${state.messages.length} new</small></div>
     <div class="phone-item"><span>Memory</span><small>${state.memories.length}</small></div>
   </div>
   <div class="phone-section"><h3>❤️ 关系</h3>
     <div class="rel"><div class="relhead"><span>🎧 米洛</span><b>${relText(state.rel.milo)}</b></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,state.rel.milo))}%"></i></div></div>
     <div class="rel"><div class="relhead"><span>🪞 诺拉</span><b>${relText(state.rel.nora)}</b></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,state.rel.nora))}%"></i></div></div>
     <div class="rel"><div class="relhead"><span>🕶️ 陌生男人</span><b>${relText(state.rel.unknown)}</b></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,state.rel.unknown))}%"></i></div></div>
     <div class="rel"><div class="relhead"><span>🐇 绒团团</span><b>${relText(state.rel.bun)}</b></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,state.rel.bun))}%"></i></div></div>
   </div>
   <div class="phone-section"><h3>🎒 背包</h3><div class="muted" style="font-size:9px;line-height:1.55">${state.inventory.length?state.inventory.map(x=>'• '+escapeHtml(x)).join('<br>'):'空空的。'}</div></div>
   <div class="phone-section"><h3>🧠 最新记忆</h3><div class="muted" style="font-size:9px;line-height:1.55">${state.memories.length?escapeHtml(state.memories[state.memories.length-1]):'还没有特别的记忆。'}</div></div>
   </aside>
 </div>
 <div class="cards"><div class="mini"><b>💵 钱包</b><p>兼职是收入，商城会让“花钱还是花在别人身上”成为真实选择。</p></div><div class="mini"><b>🤝 关系</b><p>关系不是单一恋爱值。朋友、损友、竞争、暧昧都可以出现。</p></div><div class="mini"><b>👁️ 异常</b><p>这里的奇怪事没人太在意。真正的问题是：什么时候世界开始“出错”？</p></div></div>
 </div>
 <div class="dock"><button class="active" onclick="visit('公寓')">🏠<br>公寓</button><button onclick="phone()">📱<br>手机</button><button onclick="city()">🌆<br>城市</button><button onclick="relations()">♡<br>关系</button><button onclick="nextSlot()">→<br>结束时段</button></div>`;
 const a=$('actions');
 if(state.location==='公寓'){
   a.innerHTML=[
    ['找米洛','看看他今天在干嘛。',()=>meetMilo()],
    ['找诺拉',state.day>=2?'她可能已经回来了。':'她还没出现。',()=>meetNora()],
    ['找绒团团','它可能知道不该知道的事。',()=>meetBun()],
    ['去城市','便利店 / 咖啡店 / 商场 / 河岸。',()=>city()],
    ['看手机','Wallet / Chat / Memory。',()=>phone()],
    ['整理房间','房间会慢慢变成你的地方。',()=>roomFree()],
    ['看看厨房','可能很普通，也可能不太普通。',()=>kitchen()],
    ['恶作剧米洛','袜子只是开始。',()=>prank()],
    ['随便待着','没有目标也可以生活。',()=>freeAction()],
    ['今天的故事','推进当前的剧情钩子。',()=>{if(energyUse())mainEvent()}],
    ['去兼职','赚钱，也可能遇见某个人。',()=>work()],
    ['商城','买礼物、房间物品和生活用品。',()=>shop()]
   ].map(x=>`<button class="act" onclick="doAction(${x[2].toString()})"><b>${escapeHtml(x[0])}</b><small>${escapeHtml(x[1])}</small></button>`).join('');
 }else{
   a.innerHTML=`<button class="act" onclick="exploreLocation()"><b>进入地点</b><small>看看这里今天发生什么。</small></button>
   <button class="act" onclick="visit('公寓')"><b>回公寓</b><small>回去和室友生活。</small></button>
   <button class="act" onclick="nextSlot()"><b>离开这里</b><small>把这个时间段交给城市自己运行。</small></button>`;
 }
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
if(!state.name)openIntro();else render();
</script>
</body>
</html>
